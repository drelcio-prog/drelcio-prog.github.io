<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kashu">
<meta name="theme-color" content="#0b1210">
<title>Kashu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1210;color:#f3eee4;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.app{width:100%;max-width:430px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.logo-k{width:48px;height:48px;flex:0 0 48px;display:block}
.brand h1{margin:0;font-size:1.35rem;letter-spacing:-.03em}
.tag{margin:2px 0 0;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#9aa7a1}
.card{background:linear-gradient(145deg,#10261e,#1a4333);border-radius:18px;padding:14px}
.label{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.val{font-size:1.7rem;font-weight:800;margin:4px 0 10px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px}
.mini span{display:block;font-size:.68rem;opacity:.8}
.hint{font-size:.78rem;color:#b7c2bb;text-align:center;margin:10px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#1b2a24;border-radius:14px;padding:4px;margin:8px 0}
.seg button{border:0;background:transparent;color:#b7c2bb;border-radius:11px;padding:11px 8px}
.seg button.on{background:#14201b;color:#f3eee4;font-weight:700}
.micwrap{display:grid;place-items:center;padding:8px 0}
.mic{width:92px;height:92px;border:0;border-radius:50%;background:#1a5c44;color:#fff;font-size:2rem}
.mic.listen{background:#c44536}
input,select,button{font:inherit;max-width:100%}
input,select{width:100%;background:#0b1210;color:#f3eee4;border:1px solid #2a3d35;border-radius:12px;padding:12px;font-size:16px}
label{display:grid;gap:4px;font-size:.75rem;color:#b7c2bb;margin:8px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;background:#8fd4b4;color:#0b1210;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 0;border-bottom:1px solid #2a3d35}
.item small{display:block;color:#b7c2bb;font-size:.72rem;margin-top:3px}
.cred{color:#4ade80}
.panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);padding:12px;align-items:flex-end;z-index:20}
.panel.open{display:flex}
.sheet{width:100%;max-width:430px;margin:0 auto;background:#14201b;border-radius:20px;padding:14px;max-height:85dvh;overflow:auto}
.hide{display:none!important}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.col{background:#14201b;border-radius:16px;padding:10px}
.col h3{margin:0;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#9aa7a1}
.col .tot{font-weight:800;margin:6px 0 8px;font-size:.95rem}
.pitem{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px solid #2a3d35}
.pitem:last-child{border-bottom:0}
.plus{width:28px;height:28px;border:0;border-radius:50%;background:#1a5c44;color:#fff;font-size:1.1rem;line-height:28px;padding:0;flex:0 0 28px}
.checkrow{display:flex;align-items:center;gap:10px;margin:12px 0;color:#f3eee4}
.checkrow input{width:22px;height:22px;accent-color:#8fd4b4}
h2.sec{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#9aa7a1;margin:18px 0 4px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <svg class="logo-k" viewBox="0 0 80 80" aria-label="Kashu">
      <defs>
        <linearGradient id="kg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#0b5c48"/>
          <stop offset=".5" stop-color="#1aa36f"/>
          <stop offset="1" stop-color="#7af0b0"/>
        </linearGradient>
      </defs>
      <path fill="url(#kg)" d="M18 8c0-3 2-6 6-6h10c3 0 6 3 6 6v28l18-16c2-2 6-2 8 0l7 7c2 2 2 6 0 8L52 50l16 18c2 2 2 6 0 8l-7 7c-2 2-6 2-8 0L40 66v8c0 3-3 6-6 6H24c-4 0-6-3-6-6V8z"/>
      <rect x="22" y="46" width="5" height="14" rx="1.5" fill="#8ff0b8"/>
      <rect x="29" y="38" width="5" height="22" rx="1.5" fill="#5fe0a0"/>
      <rect x="36" y="28" width="5" height="32" rx="1.5" fill="#3ccf88"/>
    </svg>
    <div class="brand">
      <h1>Kashu</h1>
      <p class="tag">Seu financeiro mais simples</p>
    </div>
  </div>
  <div class="card">
    <div class="label">Saldo disponível</div>
    <div class="val" id="saldo">R$ 0,00</div>
    <div class="mini">
      <div><span>Recebido hoje</span><strong id="rec">R$ 0,00</strong></div>
      <div><span>Pago hoje</span><strong id="pag">R$ 0,00</strong></div>
    </div>
  </div>
  <p class="hint">Sem a palavra “pago” ou “recebido”, o lançamento entra como previsto. Dê baixa no +.</p>
  <div class="seg">
    <button type="button" id="tVoz" class="on">Por voz</button>
    <button type="button" id="tMan">Manual</button>
  </div>
  <div id="boxVoz">
    <div class="micwrap"><button class="mic" id="mic" type="button">🎤</button></div>
    <p class="hint" id="tr">Toque no microfone</p>
  </div>
  <form id="boxMan" class="hide">
    <label>Descrição<input name="d" required></label>
    <div class="g2">
      <label>Tipo<select name="t"><option value="debito">Despesa</option><option value="credito">Receita</option></select></label>
      <label>Valor<input name="v" type="number" step="0.01" min="0" required inputmode="decimal"></label>
    </div>
    <label>Data do lançamento<input name="dt" type="date" required></label>
    <label>Situação<select name="p"><option value="0" selected>Previsto</option><option value="1">Pago / Recebido</option></select></label>
    <button class="btn" type="submit">Lançar</button>
  </form>
  <h2 class="sec">Previsto</h2>
  <div class="cols">
    <div class="col">
      <h3>Despesa</h3>
      <div class="tot" id="totDesp">R$ 0,00</div>
      <div id="colDesp"></div>
    </div>
    <div class="col">
      <h3>Receita</h3>
      <div class="tot cred" id="totRec">R$ 0,00</div>
      <div id="colRec"></div>
    </div>
  </div>
  <h2 class="sec">Realizado</h2>
  <div id="lista"></div>
</div>
<div class="panel" id="ov">
  <div class="sheet">
    <h3 style="margin:0 0 8px">Revisar</h3>
    <p class="hint" id="ovTxt"></p>
    <form id="rev">
      <label>Descrição<input name="d" required></label>
      <div class="g2">
        <label>Tipo<select name="t"><option value="debito">Despesa</option><option value="credito">Receita</option></select></label>
        <label>Valor<input name="v" type="number" step="0.01" min="0" required inputmode="decimal"></label>
      </div>
      <label>Data do lançamento<input name="dt" type="date" required></label>
      <label>Situação<select name="p"><option value="0" selected>Previsto</option><option value="1">Pago / Recebido</option></select></label>
      <button class="btn" type="submit">Confirmar</button>
      <button class="btn" type="button" id="cancel" style="background:#1b2a24;color:#f3eee4">Cancelar</button>
    </form>
  </div>
</div>
<div class="panel" id="baixa">
  <div class="sheet">
    <h3 style="margin:0 0 8px">Lançamento previsto</h3>
    <p id="bxDesc" style="margin:0 0 4px"></p>
    <p class="hint" id="bxMeta"></p>
    <label class="checkrow"><input type="checkbox" id="bxCheck"> Dar baixa (pago / recebido)</label>
    <button class="btn" type="button" id="bxOk">Salvar</button>
    <button class="btn" type="button" id="bxClose" style="background:#1b2a24;color:#f3eee4">Fechar</button>
  </div>
</div>
<script>
const KEY="kashu.pages.v2";
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
function uid(){return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hojeISO(){const d=new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const x=new Date(y,m-1,d+n);const z=k=>String(k).padStart(2,"0");return x.getFullYear()+"-"+z(x.getMonth()+1)+"-"+z(x.getDate())}
function fmtData(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y}
function fold(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function parseData(text){
  const t=fold(text);
  if(/ontem/.test(t)) return addDays(hojeISO(),-1);
  if(/amanha/.test(t)) return addDays(hojeISO(),1);
  const br=t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(br){ let y=br[3]?Number(br[3]):new Date().getFullYear(); if(y<100) y+=2000; const z=n=>String(n).padStart(2,"0"); return y+"-"+z(br[2])+"-"+z(br[1]); }
  return hojeISO();
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY))||{movs:[]};
    if(!Array.isArray(s.movs)) s.movs=[];
    s.movs.forEach(m=>{ if(!m.id) m.id=uid(); if(!m.data) m.data=hojeISO(); });
    return s;
  }catch{return{movs:[]}}
}
function tot(s){
  let saldo=0,rec=0,pag=0,prevD=0,prevR=0; const h=hojeISO();
  s.movs.forEach(m=>{
    const v=Number(m.valor)||0;
    if(!m.pago){ if(m.tipo==="credito") prevR+=v; else prevD+=v; return; }
    saldo += m.tipo==="credito"?v:-v;
    if(m.data===h){ if(m.tipo==="credito") rec+=v; else pag+=v; }
  });
  s.saldo=saldo; return {saldo,rec,pag,prevD,prevR};
}
function save(s){ tot(s); localStorage.setItem(KEY,JSON.stringify(s)); }
function parseValor(text){
  const t=fold(text).replace(/reais?/g," ").replace(/r\$/g," ");
  const m=t.match(/(\d{1,3}(?:\.\d{3})+,\d{1,2}|\d+,\d{1,2}|\d+\.\d{1,2}|\d+)/);
  if(!m)return null; let raw=m[1];
  if(raw.includes(",")&&raw.includes(".")) raw=raw.replace(/\./g,"").replace(",",".");
  else if(raw.includes(",")) raw=raw.replace(",",".");
  const n=Number(raw); return Number.isFinite(n)?n:null;
}
function parseTipo(text){const t=fold(text); if(/credito|receita|recebi|receber|honorario/.test(t)) return "credito"; return "debito"}
function parsePago(text){
  const t=fold(text);
  if(/pendente|previsto|a pagar|a receber/.test(t)) return false;
  return /\b(pago|paguei|pagou|recebido|recebi)\b/.test(t);
}
function parseDesc(text){return String(text||"").replace(/lancar|lance/ig,"").replace(/\b(debito|credito|despesa|receita|pago|recebido|pendente|previsto|hoje|ontem|amanha|reais?|como)\b/ig,"").replace(/\d[\d.,]*/g,"").replace(/\s+/g," ").trim()||"Lançamento"}
function ehSaldo(t){return /saldo/.test(fold(t)) && /qual|quanto|meu|disponivel/.test(fold(t))}
function render(){
  const s=load(); const t=tot(s); save(s);
  saldo.textContent=brl(t.saldo); rec.textContent=brl(t.rec); pag.textContent=brl(t.pag);
  totDesp.textContent=brl(t.prevD); totRec.textContent=brl(t.prevR);
  const pend=s.movs.filter(m=>!m.pago);
  const ok=s.movs.filter(m=>m.pago);
  colDesp.innerHTML=pend.filter(m=>m.tipo!=="credito").slice().reverse().map(rowPrev).join("")||"<p class='hint'>Nenhuma</p>";
  colRec.innerHTML=pend.filter(m=>m.tipo==="credito").slice().reverse().map(rowPrev).join("")||"<p class='hint'>Nenhuma</p>";
  lista.innerHTML=ok.slice().reverse().slice(0,40).map(m=>`<div class="item"><span>${m.descricao}<small>${fmtData(m.data)}</small></span><strong class="${m.tipo==="credito"?"cred":""}">${m.tipo==="credito"?"+":"\u2212"} ${brl(m.valor)}</strong></div>`).join("");
}
function rowPrev(m){
  return `<div class="pitem"><div><div>${m.descricao}</div><small>${fmtData(m.data)} · ${brl(m.valor)}</small></div><button class="plus" type="button" data-id="${m.id}" aria-label="Abrir">+</button></div>`;
}
function gravar(o){
  const s=load();
  s.movs.push({id:uid(),descricao:o.d,tipo:o.t,valor:Number(o.v)||0,pago:!!o.p,data:o.dt||hojeISO()});
  save(s); render();
}
function abrirBaixa(id){
  const m=load().movs.find(x=>x.id===id); if(!m) return;
  baixa.dataset.id=id;
  bxDesc.textContent=m.descricao;
  bxMeta.textContent=fmtData(m.data)+" · "+(m.tipo==="credito"?"Receita":"Despesa")+" · "+brl(m.valor);
  bxCheck.checked=false;
  baixa.classList.add("open");
}
boxMan.dt.value=hojeISO();
tVoz.onclick=()=>{tVoz.classList.add("on");tMan.classList.remove("on");boxVoz.classList.remove("hide");boxMan.classList.add("hide")};
tMan.onclick=()=>{tMan.classList.add("on");tVoz.classList.remove("on");boxMan.classList.remove("hide");boxVoz.classList.add("hide"); boxMan.dt.value=hojeISO()};
boxMan.onsubmit=e=>{e.preventDefault();const fd=new FormData(boxMan);gravar({d:fd.get("d"),t:fd.get("t"),v:fd.get("v"),p:fd.get("p")==="1",dt:fd.get("dt")});boxMan.reset();boxMan.dt.value=hojeISO();boxMan.p.value="0"};
cancel.onclick=()=>ov.classList.remove("open");
rev.onsubmit=e=>{e.preventDefault();const fd=new FormData(rev);gravar({d:fd.get("d"),t:fd.get("t"),v:fd.get("v"),p:fd.get("p")==="1",dt:fd.get("dt")});ov.classList.remove("open")};
bxClose.onclick=()=>baixa.classList.remove("open");
bxOk.onclick=()=>{
  const id=baixa.dataset.id;
  if(bxCheck.checked){
    const s=load();
    const m=s.movs.find(x=>x.id===id);
    if(m){ m.pago=true; m.data=m.data||hojeISO(); }
    save(s); render();
  }
  baixa.classList.remove("open");
};
document.addEventListener("click",e=>{
  const b=e.target.closest(".plus"); if(!b) return;
  abrirBaixa(b.dataset.id);
});
function falar(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang="pt-BR";speechSynthesis.speak(u)}catch(e){}}
function abrir(txt){
  if(ehSaldo(txt)){ const t=tot(load()); tr.textContent="Saldo disponível: "+brl(t.saldo); falar("Saldo disponível "+brl(t.saldo)); return; }
  ovTxt.textContent=txt||"";
  rev.d.value=parseDesc(txt); rev.t.value=parseTipo(txt); rev.v.value=parseValor(txt)??"";
  rev.p.value=parsePago(txt)?"1":"0"; rev.dt.value=parseData(txt);
  ov.classList.add("open");
}
mic.onclick=()=>{
  if(!Rec){tr.textContent="Use o Safari para a voz.";return}
  const r=new Rec(); r.lang="pt-BR"; r.interimResults=true;
  mic.classList.add("listen"); tr.textContent="Ouvindo…";
  r.onresult=ev=>{let fin="",inter=""; for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i][0].transcript; if(ev.results[i].isFinal)fin+=x; else inter+=x;} tr.textContent=fin||inter; if(fin){mic.classList.remove("listen"); abrir(fin);}};
  r.onerror=()=>{mic.classList.remove("listen"); tr.textContent="Não reconheceu.";};
  r.onend=()=>mic.classList.remove("listen");
  try{r.start()}catch(e){tr.textContent="Toque de novo.";}
};
render();
</script>
</body>
</html>
